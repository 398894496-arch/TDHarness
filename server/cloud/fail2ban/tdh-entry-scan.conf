# company-mobile-entry-v1: a path this entry refused itself in tdh-entry.log (log_format tdh_entry; up=- means no
# answer from the company site, so the app's own 404s from the site, e.g. GET /company/login, do not count).
[Definition]
failregex = ^<HOST> .*?"[A-Z]+ [^"]*" (?:400|404) .* up=-$
ignoreregex =
