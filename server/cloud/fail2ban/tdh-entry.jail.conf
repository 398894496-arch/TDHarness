# company-mobile-entry-v1: bans on the phones' entry (tdh-entry.nginx.conf). install-entry.sh puts this file in
# /etc/fail2ban/jail.d/ and the two filters in /etc/fail2ban/filter.d/. Bans close TCP 8443 only (nftables).
#
# Debian's own [sshd] jail reads /var/log/auth.log, which this server (journald only) has not: with it fail2ban
# does not start at all. It stays off here; sshd takes keys only.
[sshd]
enabled = false

# Sign-in failures (401) and sign-ins refused for too many tries (429, by the company or by nginx): 8 in 10 minutes
# from one address, banned for an hour. The company's own throttle (people-api, per login and address) stays as it is.
[tdh-entry-login]
enabled = true
filter = tdh-entry-login
logpath = /var/log/nginx/tdh-entry.log
backend = polling
port = 8443
banaction = nftables[type=multiport]
maxretry = 8
findtime = 10m
bantime = 1h

# Scanners: 40 refused paths (400, 404) in 10 minutes from one address. The app itself never asks for one.
[tdh-entry-scan]
enabled = true
filter = tdh-entry-scan
logpath = /var/log/nginx/tdh-entry.log
backend = polling
port = 8443
banaction = nftables[type=multiport]
maxretry = 40
findtime = 10m
bantime = 6h
