# company-mobile-entry-v1: a failed or refused sign-in in tdh-entry.log (log_format tdh_entry).
[Definition]
# POST only: the phone's GET probe of /company/login (429 when it asks often) is not a failed sign-in, and counting
# it banned an employee's phone for an hour (2026-11-26).
failregex = ^<HOST> .*?"POST /company/login(?:/[A-Za-z-]*)?" (?:401|429) 
ignoreregex =
