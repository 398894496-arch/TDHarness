# company-mobile-entry-v1: the phones' way in from outside the company, on the cloud hub (118.190.105.26:8443).
# Installed by install-entry.sh as /etc/nginx/conf.d/tdh-entry.conf.
#
# TLS ends here, with a certificate for the site's name (tdharness.local) from the entry's own CA (entry-ca.ps1 on the
# company server keeps that CA's key; its name constraint allows tdharness.local only). The phone app trusts that CA
# beside the company root (Site.json "more_ca"); desks do not, so this machine cannot pass for the company server to
# anyone but the app on this path. No domain name, so no ICP filing: the app dials the IP and checks the name.
#
# Only what the app needs goes on, through the company tunnel to the company site (10.66.0.2:8443, its certificate
# checked against the company root): sign-in, the person's desk on the server, the company chat (page, API with
# WebSocket and long polling, voice and call pieces), and the assistant's two gateway calls. Everything else is 404.
# Raw paths with encoded dots or slashes, "..", or "//" are refused before any of it (400), so nothing reaches past
# the allowed prefixes however the far side would read them.
#
# The company site trusts X-Forwarded-For from 10.66.0.1 (site-cs.py "entry_proxy"), so its own sign-in throttle
# counts each phone's address; this sets it to the caller's address and drops whatever the caller sent.
# Per address: 30 requests a second (burst 120), 60 connections, sign-in 10 a minute (burst 10); fail2ban
# (tdh-entry.fail2ban.conf) bans repeated sign-in failures and scanners. The log has no query strings.

# up= is the company site when it answered, "-" when this entry refused the request itself (fail2ban's scan rule).
log_format tdh_entry '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent" up=$upstream_addr';

limit_req_zone $binary_remote_addr zone=tdh_entry_req:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tdh_entry_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=tdh_entry_conn:10m;

map $http_upgrade $tdh_entry_connection {
	default upgrade;
	"" "";
}

map $request_uri $tdh_entry_bad_path {
	default 0;
	"~^[^?]*(%2[eEfF]|%5[cC]|%00|\.\.|//)" 1;
}

upstream tdh_entry_site {
	server 10.66.0.2:8443;
	keepalive 32;
}

server {
	# TCP keepalive towards the phones (company-phone-stream-watch-v1): a mobile network drops an idle connection
	# without a word; the probes keep its path open and let this side notice one that is gone.
	listen 8443 ssl default_server so_keepalive=30s:10s:3;
	server_name _;
	server_tokens off;

	ssl_certificate /etc/tdh-entry/entry.crt;
	ssl_certificate_key /etc/tdh-entry/entry.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:tdh_entry_tls:10m;
	ssl_session_timeout 1h;

	access_log /var/log/nginx/tdh-entry.log tdh_entry;
	error_log /var/log/nginx/tdh-entry.err warn;

	limit_req_status 429;
	limit_conn_status 429;
	limit_conn tdh_entry_conn 60;
	limit_req zone=tdh_entry_req burst=120 nodelay;
	client_max_body_size 20m;

	if ($tdh_entry_bad_path) {
		return 400;
	}

	proxy_http_version 1.1;
	proxy_set_header Host tdharness.local:8443;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header X-Forwarded-Host "";
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $tdh_entry_connection;
	proxy_ssl_server_name on;
	proxy_ssl_name tdharness.local;
	proxy_ssl_verify on;
	proxy_ssl_verify_depth 3;
	proxy_ssl_trusted_certificate /etc/tdh-entry/company-root.crt;
	proxy_ssl_session_reuse on;
	proxy_buffering off;
	proxy_request_buffering off;
	proxy_connect_timeout 10s;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;

	# Sign-in: password, SMS code (and asking for one), 30-day resume, forget this phone.
	location = /company/login {
		limit_req zone=tdh_entry_login burst=10 nodelay;
		proxy_pass https://tdh_entry_site;
	}
	location ^~ /company/login/ {
		limit_req zone=tdh_entry_login burst=10 nodelay;
		proxy_pass https://tdh_entry_site;
	}
	# The person's own desk on the server (company-desk-hub-v1), WebSocket included; the hub checks the login token.
	location ^~ /desk-hub/ {
		proxy_pass https://tdh_entry_site;
	}
	# The company chat: its page, Tinode's API (WebSocket, long polling, uploads up to its 200 MB), the person's own
	# chats, voice messages and call pieces (people service, with the login token).
	location = /chat {
		proxy_pass https://tdh_entry_site;
	}
	location ^~ /chat/ {
		proxy_pass https://tdh_entry_site;
	}
	location ^~ /v0/ {
		client_max_body_size 200m;
		proxy_pass https://tdh_entry_site;
	}
	location ^~ /company/ext/chat/ {
		client_max_body_size 50m;
		proxy_pass https://tdh_entry_site;
	}
	# The assistant: the site's models, and the streamed answer (the gateway checks the token).
	location = /gw/v1/company-models {
		proxy_pass https://tdh_entry_site;
	}
	location = /gw/v1/chat/completions {
		limit_except POST {
			deny all;
		}
		proxy_pass https://tdh_entry_site;
	}
	location / {
		return 404;
	}
}
