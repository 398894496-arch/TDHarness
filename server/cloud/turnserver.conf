# company-turn-v1: the TURN server for company chat calls (coturn), on the cloud hub. install-entry.sh writes it to
# /etc/turnserver.conf (0640 root:turnserver) with __SECRET__ replaced by /etc/tdh-entry/turn.secret (made once there;
# the company server keeps the same in D:\dsh\runtime\chat-turn.secret, and Tinode hands out credentials made from it:
# tinode-setup.py, company-turn-v1). Credentials are coturn's time-limited kind (use-auth-secret): "<expiry>:tdh".
#
# Alibaba Cloud's firewall (the console, not this machine) must let in UDP 3478, TCP 3478 and UDP 49160-49200.
# Relays go to public addresses only: never to the company tunnel (10.66.0.0/24), the cloud's own networks or its
# metadata service (100.100.100.200), so a TURN credential is no way into the company. The exception is this
# machine's own relay address, so that two callers who both need TURN reach each other.
# No IPv6 range that holds ::ffff:0:0/96: coturn checks IPv4 peers against IPv6 ranges as mapped addresses, and
# "::-::ffff:ffff:ffff" refused every IPv4 peer (8.8.8.8 included; 11-25). The relay is IPv4 only anyway.

listening-ip=__PRIVATE_IP__
relay-ip=__PRIVATE_IP__
external-ip=__PUBLIC_IP__/__PRIVATE_IP__
listening-port=3478
min-port=49160
max-port=49200

use-auth-secret
static-auth-secret=__SECRET__
realm=tdharness.local
fingerprint
stale-nonce=600

no-tls
no-dtls
no-tcp-relay
no-cli
no-multicast-peers
no-software-attribute
user-quota=12
total-quota=120

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=__PRIVATE_IP__

syslog
simple-log
